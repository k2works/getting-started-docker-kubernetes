site_name: Site Name
site_description: Site Description
site_author: Project Team
repo_url: https://github.com/k2works/claude-code-booster
repo_name: claude-code-booster

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

extra_css:
  - assets/css/extra.css

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: plantuml
          class: plantuml
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist
  - pymdownx.emoji
  - admonition
  - toc:
      permalink: true
  - plantuml_markdown:
      server: !!python/object/apply:os.getenv
        - PLANTUML_SERVER_URL
        - http://www.plantuml.com/plantuml
      format: svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js
  - assets/js/extra.js

extra:
  plantuml_url: http://www.plantuml.com/plantuml
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/k2works
      name: GitHub Repository/claude-code-booster

plugins:
  - search

exclude_docs: |
  wiki

nav:
  - Home: index.md
  - 戦略:
      - 概要: strategy/index.md
  - 要件:
      - 概要: requirements/index.md
  - 設計:
      - 概要: design/index.md
  - 開発:
      - 概要: development/index.md
  - 運用:
      - 概要: operation/index.md
      - 運用コマンドリファレンス: operation/運用コマンドリファレンス.md
  - レビュー:
      - 概要: review/index.md
  - ADR:
      - 概要: adr/index.md
  - 記事:
      - 概要: article/index.md
      - Docker/Kubernetes 実践コンテナ解説:
          - 概要: article/getting-start-docker-kubernetes/index.md
          - 執筆計画: article/getting-start-docker-kubernetes/outline.md
          - 第 1 章 コンテナと Docker の基礎: article/getting-start-docker-kubernetes/01-container-and-docker-basics.md
          - 第 2 章 コンテナのデプロイ: article/getting-start-docker-kubernetes/02-container-deployment.md
          - 第 3 章 実用的なコンテナの構築とデプロイ: article/getting-start-docker-kubernetes/03-practical-container-build-deploy.md
          - 第 4 章 複数コンテナ構成でのアプリケーション構築: article/getting-start-docker-kubernetes/04-multi-container-application.md
          - 第 5 章 Kubernetes 入門: article/getting-start-docker-kubernetes/05-kubernetes-introduction.md
          - 第 6 章 Kubernetes のデプロイ・クラスタ構築: article/getting-start-docker-kubernetes/06-kubernetes-deploy-cluster.md
          - 第 7 章 Kubernetes の発展的な利用: article/getting-start-docker-kubernetes/07-kubernetes-advanced.md
          - 第 8 章 Kubernetes アプリケーションのパッケージング: article/getting-start-docker-kubernetes/08-kubernetes-packaging.md
          - 第 9 章 コンテナの運用: article/getting-start-docker-kubernetes/09-container-operations.md
          - 第 10 章 最適なコンテナイメージ作成と運用: article/getting-start-docker-kubernetes/10-optimal-container-image.md
          - 第 11 章 コンテナにおける継続的デリバリー: article/getting-start-docker-kubernetes/11-continuous-delivery.md
          - 第 12 章 コンテナのさまざまな活用方法: article/getting-start-docker-kubernetes/12-container-use-cases.md
          - 第 13 章 モノリスのデプロイ（Compose 対 Kustomize）: article/getting-start-docker-kubernetes/13-case-monolith-compose-vs-kustomize.md
          - 第 14 章 イベント駆動MSのデプロイ（Kustomize 対 Helm）: article/getting-start-docker-kubernetes/14-case-event-driven-kustomize-vs-helm.md
          - 第 15 章 ES/CQRS(Axon)のデプロイ（Kustomize 対 Helm）: article/getting-start-docker-kubernetes/15-case-escqrs-axon-kustomize-vs-helm.md
          - 第 16 章 ES/CQRS(Kafka)のデプロイ（Kustomize 対 Helm）: article/getting-start-docker-kubernetes/16-case-escqrs-kafka-kustomize-vs-helm.md
          - 第 17 章 ケーススタディ実装比較まとめ: article/getting-start-docker-kubernetes/17-case-comparison-summary.md
          - 付録 A 開発ツールのセットアップ: article/getting-start-docker-kubernetes/appendix-a-dev-tools-setup.md
          - 付録 B さまざまなコンテナオーケストレーション環境: article/getting-start-docker-kubernetes/appendix-b-orchestration-environments.md
          - 付録 C コンテナ開発・運用の Tips: article/getting-start-docker-kubernetes/appendix-c-tips.md
  - リファレンス:
      - 概要: reference/index.md
      - よいソフトウェアとは: reference/よいソフトウェアとは.md
      - ロジカルシンキング: reference/ロジカルシンキング.md
      - 開発ガイド: reference/開発ガイド.md
      - 経営戦略分析ガイド: reference/経営戦略分析ガイド.md
      - ビジネスアーキテクチャ分析ガイド: reference/ビジネスアーキテクチャ分析ガイド.md
      - 要件定義ガイド: reference/要件定義ガイド.md
      - ユースケース作成ガイド: reference/ユースケース作成ガイド.md
      - アーキテクチャ設計ガイド: reference/アーキテクチャ設計ガイド.md
      - データモデル設計ガイド: reference/データモデル設計ガイド.md
      - ドメインモデル設計ガイド: reference/ドメインモデル設計ガイド.md
      - UI 設計ガイド: reference/UI設計ガイド.md
