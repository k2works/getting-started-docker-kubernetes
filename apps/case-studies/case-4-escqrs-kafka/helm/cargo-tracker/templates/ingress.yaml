{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cargo-tracker
  labels:
    {{- include "cargo-tracker.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                {{- if .Values.frontend.enabled }}
                # 公開エントリポイントは frontendms（"/api/" は frontend 内 nginx が gatewayms へプロキシ）
                name: {{ .Values.frontend.name }}
                port:
                  number: {{ .Values.frontend.port }}
                {{- else }}
                name: gatewayms
                port:
                  number: 8080
                {{- end }}
{{- end }}
