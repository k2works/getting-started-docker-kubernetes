apiVersion: v1
kind: ConfigMap
metadata:
  name: cargo-config
  labels:
    {{- include "cargo-tracker.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.config.springProfilesActive | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.config.kafkaBootstrap | quote }}
  SENDGRID_FROM_EMAIL: {{ .Values.config.sendgridFromEmail | quote }}
  SENDGRID_FROM_NAME: {{ .Values.config.sendgridFromName | quote }}
  BILLING_STRIPE_WEBHOOK_TOLERANCE_SECONDS: {{ .Values.config.stripeWebhookToleranceSeconds | quote }}
  # gatewayms から各 ms への内部 URL
  {{- range .Values.microservices }}
  {{- if not .gateway }}
  {{ .name | upper }}_URL: {{ printf "http://%s:%d" .name (int .port) | quote }}
  {{- end }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    {{- include "cargo-tracker.labels" . | nindent 4 }}
data:
  init-databases.sh: |
    #!/bin/bash
    # 複数 DB を作成（POSTGRES_MULTIPLE_DATABASES をカンマ区切りで読む）
    set -e
    set -u

    function create_user_and_database() {
        local database
        database=$(echo "$1" | tr -d '[:space:]')
        if [ -z "$database" ]; then
            return
        fi
        echo "  Creating database '$database' owned by '$POSTGRES_USER'"
        psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "postgres" <<-EOSQL
            SELECT 'CREATE DATABASE $database OWNER $POSTGRES_USER'
            WHERE NOT EXISTS (
                SELECT FROM pg_database WHERE datname = '$database'
            )\gexec
    EOSQL
    }

    if [ -n "${POSTGRES_MULTIPLE_DATABASES:-}" ]; then
        echo "Multiple database creation requested: $POSTGRES_MULTIPLE_DATABASES"
        for db in $(echo "$POSTGRES_MULTIPLE_DATABASES" | tr ',' ' '); do
            create_user_and_database "$db"
        done
        echo "Multiple databases created"
    fi
{{- if .Values.secret.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: cargo-secret
  labels:
    {{- include "cargo-tracker.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secret.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secret.postgresPassword | quote }}
  JWT_SECRET: {{ .Values.secret.jwtSecret | quote }}
  TRACKING_PUBLIC_TOKEN_SECRET: {{ .Values.secret.trackingPublicTokenSecret | quote }}
  TRACKING_PUBLIC_TOKEN_PREVIOUS_SECRET: {{ .Values.secret.trackingPublicTokenPreviousSecret | quote }}
  SENDGRID_API_KEY: {{ .Values.secret.sendgridApiKey | quote }}
  STRIPE_WEBHOOK_SIGNING_SECRET: {{ .Values.secret.stripeWebhookSigningSecret | quote }}
{{- end }}
