apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ローカル検証（minikube / kind / Docker Desktop）用オーバーレイ
resources:
  - ../../base

# gatewayms を NodePort で直接叩けるようにする（Ingress を使わない場合）
patches:
  - target:
      kind: Service
      name: gatewayms
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
