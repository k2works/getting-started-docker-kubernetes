apiVersion: v1
kind: Service
metadata:
  name: handlingms
  labels:
    app: handlingms
spec:
  selector:
    app: handlingms
  ports:
    - name: http
      port: 8085
      targetPort: 8085
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: handlingms
  labels:
    app: handlingms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: handlingms
  template:
    metadata:
      labels:
        app: handlingms
    spec:
      # Kafka が起動してから本体を起動する（DevDataSeeder の producer 構築失敗を防ぐ）
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'until nc -w 2 kafka 29092 < /dev/null; do echo "waiting for kafka:29092"; sleep 3; done; echo "kafka ready"; sleep 5'
      containers:
        - name: handlingms
          image: cargo-tracker/handlingms:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
          envFrom:
            - configMapRef:
                name: cargo-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgresql:5432/handling_read_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cargo-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cargo-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
