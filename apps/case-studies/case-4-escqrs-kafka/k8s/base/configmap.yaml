# アプリケーション共通設定（非機密）
apiVersion: v1
kind: ConfigMap
metadata:
  name: cargo-config
data:
  SPRING_PROFILES_ACTIVE: local-docker
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  # SendGrid 送信元（未設定 API キー時はログ通知に縮退、ADR-0018）
  SENDGRID_FROM_EMAIL: noreply@cargo-tracker.example.com
  SENDGRID_FROM_NAME: Cargo Tracker
  # Stripe webhook（ADR-0020）
  BILLING_STRIPE_WEBHOOK_TOLERANCE_SECONDS: "300"
  # gatewayms から各 ms への内部 URL（Kubernetes Service DNS）
  AUTHMS_URL: http://authms:8081
  BOOKINGMS_URL: http://bookingms:8082
  ROUTINGMS_URL: http://routingms:8083
  TRACKINGMS_URL: http://trackingms:8084
  HANDLINGMS_URL: http://handlingms:8085
  BILLINGMS_URL: http://billingms:8086
---
# PostgreSQL 複数 DB 初期化スクリプト（docker-compose の bind mount を ConfigMap 化）
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  init-databases.sh: |
    #!/bin/bash
    # PostgreSQL コンテナ初期化時に複数データベースを作成するスクリプト
    # 環境変数 POSTGRES_MULTIPLE_DATABASES にカンマ区切りで DB 名を指定する。
    set -e
    set -u

    function create_user_and_database() {
        local database
        database=$(echo "$1" | tr -d '[:space:]')
        if [ -z "$database" ]; then
            return
        fi
        echo "  Creating database '$database' owned by '$POSTGRES_USER'"
        psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "postgres" <<-EOSQL
            SELECT 'CREATE DATABASE $database OWNER $POSTGRES_USER'
            WHERE NOT EXISTS (
                SELECT FROM pg_database WHERE datname = '$database'
            )\gexec
    EOSQL
    }

    if [ -n "${POSTGRES_MULTIPLE_DATABASES:-}" ]; then
        echo "Multiple database creation requested: $POSTGRES_MULTIPLE_DATABASES"
        for db in $(echo "$POSTGRES_MULTIPLE_DATABASES" | tr ',' ' '); do
            create_user_and_database "$db"
        done
        echo "Multiple databases created"
    fi
