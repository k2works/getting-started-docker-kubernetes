# アプリケーション共通シークレット（開発用デフォルト値）
#
# 警告: ここに記載した値は開発・ローカル検証専用です。
#   本番では overlays/prod 側で Sealed Secrets / External Secrets Operator /
#   kubectl create secret --from-env-file=.env 等に置き換えてください
#   （ハードコード禁止の原則、ADR と整合）。
#
# docker-compose.yml の .env に対応:
#   POSTGRES_USER / POSTGRES_PASSWORD / JWT_SECRET /
#   TRACKING_PUBLIC_TOKEN_SECRET / SENDGRID_API_KEY /
#   STRIPE_WEBHOOK_SIGNING_SECRET
apiVersion: v1
kind: Secret
metadata:
  name: cargo-secret
type: Opaque
stringData:
  POSTGRES_USER: cargo
  POSTGRES_PASSWORD: cargo-dev-password
  JWT_SECRET: dev-only-jwt-secret-please-override-in-prod-32+bytes
  TRACKING_PUBLIC_TOKEN_SECRET: dev-only-tracking-public-token-secret-32+bytes
  TRACKING_PUBLIC_TOKEN_PREVIOUS_SECRET: ""
  SENDGRID_API_KEY: ""
  STRIPE_WEBHOOK_SIGNING_SECRET: ""
