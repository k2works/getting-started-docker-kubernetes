apiVersion: v1
kind: Service
metadata:
  name: bookingms
  labels:
    app: bookingms
spec:
  selector:
    app: bookingms
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookingms
  labels:
    app: bookingms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookingms
  template:
    metadata:
      labels:
        app: bookingms
    spec:
      # Kafka が起動してから本体を起動する。これがないと DevDataSeeder が
      # 起動直後に走り、Kafka 未起動で producer 構築に失敗してシードされない。
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'until nc -w 2 kafka 29092 < /dev/null; do echo "waiting for kafka:29092"; sleep 3; done; echo "kafka ready"; sleep 5'
      containers:
        - name: bookingms
          image: cargo-tracker/bookingms:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: cargo-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgresql:5432/booking_read_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cargo-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cargo-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
