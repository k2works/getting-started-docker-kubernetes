# local-h2 プロファイル: H2 インメモリ DB + ローカル Kafka（Docker Compose）
# DB は H2 で起動しつつ Kafka によるイベント伝搬を local-docker と同条件で検証できる。
spring:
  datasource:
    url: jdbc:h2:mem:handlingdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

axon:
  axonserver:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    default-topic: cargo-events
    publisher:
      enabled: true
    fetcher:
      enabled: true
    consumer:
      # cross-service 購読（bookingms → handlingms の CargoSnapshot ACL）を tracking で動かすため
      # StreamableKafkaMessageSource を有効化する（ADR-0009 / ADR-0011 / memory:
      # cross-service-tracking-processor-profile-config）
      event-processor-mode: tracking
  eventhandling:
    processors:
      default:
        mode: subscribing

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.handlingms: DEBUG
    org.axonframework: INFO

