/*
 * trackingms（追跡サービス）
 *
 * 貨物の追跡情報・輸送状態・例外管理を担う。Axon Framework 5 + Axon Kafka
 * Extension による CQRS + Event Sourcing 構成。IT5（US14・US15・US16・US17）で
 * 新設し、bookingms との Saga 連携・handlingms からの状態更新を購読する。
 */

plugins {
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

dependencies {
    implementation project(':shared')

    // Spring Boot
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.security
    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.boot.starter.validation
    implementation libs.spring.boot.starter.jdbc

    // Axon Framework 5
    implementation libs.axon.spring.boot.starter
    implementation libs.axon.kafka.spring.boot.starter

    // 公開追跡照会の時限署名トークン（ADR-0013、US18）
    implementation libs.jjwt.api
    runtimeOnly libs.jjwt.impl
    runtimeOnly libs.jjwt.jackson

    // データアクセス
    implementation libs.mybatis.spring.boot.starter
    implementation libs.flyway.core
    implementation libs.flyway.database.postgresql
    runtimeOnly libs.postgresql
    runtimeOnly libs.h2

    // 通知（IT8 T3.1 / ADR-0018、SendGrid Dynamic Templates）
    implementation libs.sendgrid.java

    // AWS Secrets Manager（IT9 A2 / ADR-0021、公開トークン secret 自動回転）
    implementation libs.aws.sdk.secretsmanager

    // LocalStack 統合テスト（IT9 A2.4）
    testImplementation libs.testcontainers.junit.jupiter
    testImplementation libs.testcontainers.localstack

    // 開発時のみ
    developmentOnly libs.spring.boot.devtools

    // テスト
    testImplementation libs.axon.test
    testImplementation libs.mybatis.spring.boot.starter.test
    testImplementation libs.testcontainers.junit.jupiter
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.kafka
    // SendGrid WireMock 統合テスト（IT8 T3.3）
    testImplementation libs.wiremock
}

test {
    // useJUnitPlatform { ... } は parent build.gradle の tasks.withType(Test).configureEach で
    // excludeTags 'localstack-integration'（デフォルト）/ 'kafka-integration'（-PexcludeKafkaIntegration）
    // が設定済みなので、ここでは引数なしで呼び出して上書きしない（IT9 レビュー H7 / IT10 A3.8）。
    useJUnitPlatform()
    // Docker Desktop 29.x（MinAPI 1.40）では Testcontainers の docker-java が既定で
    // 古い API バージョンを使い HTTP 400 になるため、サポート範囲内の API バージョンを明示する。
    systemProperty 'api.version', '1.43'
    environment 'DOCKER_API_VERSION', '1.43'
    // IT5 H6 / IT6 review M7 対応：複数の @SpringBootTest（TrackingControllerIntegrationTest,
    // PublicTrackingControllerIntegrationTest）が Spring Context をキャッシュ共有することで H2
    // in-memory event store が積み重なる flaky を回避するため、テストクラスごとに JVM をフォーク
    // して context キャッシュを完全分離する。IT7 で @WebMvcTest + MockBean 分解を実施するまでの
    // 暫定対処（auto-memory: trackingms-spring-context-event-store-pollution）。
    forkEvery = 1
}

bootJar {
    archiveBaseName = 'trackingms'
}
