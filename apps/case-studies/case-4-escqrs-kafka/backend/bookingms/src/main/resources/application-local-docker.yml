# local-docker プロファイル: PostgreSQL + ローカル Kafka（Confluent）
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/booking_read_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

axon:
  axonserver:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    default-topic: cargo-events
    publisher:
      enabled: true
    fetcher:
      enabled: true
    consumer:
      # cross-service 購読（route-confirmed）を tracking で動かすため
      # StreamableKafkaMessageSource を有効化する（US11 / ADR-0009）
      event-processor-mode: tracking
  eventhandling:
    processors:
      default:
        # IT2 暫定: TokenEntry テーブル整備までは subscribing モードを使用
        # （ADR-0008 参照）
        mode: subscribing

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.bookingms: INFO
    org.axonframework: INFO

