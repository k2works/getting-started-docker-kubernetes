/*
 * ルートビルドスクリプト
 *
 * 全サブプロジェクト共通の設定（Java バージョン、依存関係、テスト設定など）を
 * subprojects ブロックで定義する。Version Catalog（gradle/libs.versions.toml）を
 * 参照してバージョンを一元管理する。
 */

plugins {
    id 'java'
    // Spring Boot プラグインはサブプロジェクトで apply するため、ルートでは apply false
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.spring.dependency.management) apply false
    alias(libs.plugins.sonarqube)
}

allprojects {
    group = 'com.example'
    version = '0.0.1-SNAPSHOT'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'jacoco'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(libs.versions.java.get() as Integer)
        }
    }

    repositories {
        mavenCentral()
    }

    // 共通依存関係（テスト系のみ。Spring Boot 系は各サブプロジェクトで宣言する）
    // spring-security-test は IT10 A1.2（US30 @WithMockUser テスト）で全 ms 共通追加。
    dependencies {
        testImplementation libs.spring.boot.starter.test
        testImplementation libs.spring.security.test
        testImplementation libs.junit.jupiter
        testImplementation libs.assertj.core
        testImplementation libs.mockito.core
        testImplementation libs.mockito.junit.jupiter
        testImplementation libs.archunit.junit5
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform {
            // IT7 T1 で Testcontainers Reusable 化（withReuse(true)）により container race を構造的に解消。
            // 通常の `check` で Kafka 統合テストを実行する。
            // CI 等で reuse 環境が無効な場合は `-PexcludeKafkaIntegration=true` で除外可能。
            // 前提条件: ~/.testcontainers.properties に testcontainers.reuse.enable=true（または環境変数）
            // 個別実行: `./gradlew :<svc>:test --tests *KafkaIntegrationTest --rerun-tasks`
            if (project.hasProperty('excludeKafkaIntegration')) {
                excludeTags 'kafka-integration'
            }
            // IT9 レビュー H7 / IT10 A3.8: LocalStack 統合テスト（trackingms の
            // AwsSecretsManagerTrackingTokenSecretProviderLocalStackIT 等）は
            // Docker + LocalStack イメージ起動で約 4 分かかるため、`:check` から
            // デフォルトで除外する。明示実行は -PincludeLocalstackIntegration=true
            // または個別実行 `./gradlew :trackingms:test --tests *LocalStackIT*`。
            if (!project.hasProperty('includeLocalstackIntegration')) {
                excludeTags 'localstack-integration'
            }
        }
        testLogging {
            events 'passed', 'failed', 'skipped'
            exceptionFormat = 'full'
        }
        // ローカル TDD ループは local-h2 プロファイルをデフォルトとする
        systemProperty 'spring.profiles.active', System.getProperty('spring.profiles.active', 'local-h2')
        // Java 25 + Mockito/ByteBuddy 互換性のため実験的モードを有効化
        jvmArgs '-Dnet.bytebuddy.experimental=true'

        // IT9 A4.2 / IT8 レビュー H3: @SpringBootTest CI コスト調整用フック。
        // -PforkEvery=1 で 1 テストクラスごとに JVM 再起動し、Spring Context 再利用効果を排除する。
        // RestShipperInfoAclWireMockIT 等の @DirtiesContext テストの周辺影響を本番 CI で計測する際に使用。
        // 既定（未指定）は forkEvery=0 = JVM 再利用（最速）。
        if (project.hasProperty('forkEvery')) {
            forkEvery = (project.property('forkEvery') as String).toLong()
        }
        // -PmaxParallelForks=N で並列 fork 数を指定（CI runner CPU 数に合わせる）。
        if (project.hasProperty('maxParallelForks')) {
            maxParallelForks = (project.property('maxParallelForks') as String).toInteger()
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-parameters']
    }

    jacoco {
        toolVersion = '0.8.13'
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
    }

    test {
        finalizedBy jacocoTestReport
    }
}
