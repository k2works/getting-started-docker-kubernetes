# local-docker プロファイル: Docker Compose で PostgreSQL を起動した本番互換設定
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:local-docker-dev-secret-key-must-be-at-least-32-bytes!!}
  expiration-ms: 86400000

logging:
  level:
    com.example.authms: INFO
