# local-docker プロファイル: PostgreSQL + ローカル Kafka（Confluent）
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/billing_read_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

axon:
  axonserver:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    default-topic: cargo-events
    publisher:
      enabled: true
    fetcher:
      enabled: true
    consumer:
      # cross-service 購読（trackingms → billingms の CargoDeliveredEvent、ADR-0015 cross-billing）
      # を tracking で動かすため StreamableKafkaMessageSource を有効化する
      # （ADR-0009 / ADR-0011 / memory: cross-service-tracking-processor-profile-config）
      event-processor-mode: tracking
  eventhandling:
    processors:
      default:
        # IT7 暫定: 既存サービスと同条件の subscribing モード
        mode: subscribing

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.billingms: INFO
    org.axonframework: INFO

