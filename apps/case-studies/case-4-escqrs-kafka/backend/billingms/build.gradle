/*
 * billingms（精算サービス）
 *
 * 配送完了後の輸送料金算出・法人割引適用・精算書発行・入金記録を担う Billing Context。
 * IT7（US21・US22・US23）で新設し、trackingms の CargoDeliveredEvent を購読して
 * CalculateInvoiceCommand を発火（ADR-0012 集約発火型 + ADR-0015 cross-billing）。
 * bookingms の ShipperInfo は REST 同期参照 + Resilience4j + Caffeine cache TTL 5min で取得（ADR-0015）。
 * PaymentRecordedEvent を集約発火で bookingms 側 Cargo を SETTLED に伝播（ADR-0012）。
 */

plugins {
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

dependencies {
    implementation project(':shared')

    // Spring Boot
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.security
    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.boot.starter.validation
    implementation libs.spring.boot.starter.jdbc

    // Axon Framework 5
    implementation libs.axon.spring.boot.starter
    implementation libs.axon.kafka.spring.boot.starter

    // データアクセス
    implementation libs.mybatis.spring.boot.starter
    implementation libs.flyway.core
    implementation libs.flyway.database.postgresql
    runtimeOnly libs.postgresql
    runtimeOnly libs.h2

    // 分散ロック（IT8 T2.1 / ADR-0017、OverdueScheduler の multi-instance 排他制御）
    implementation libs.shedlock.spring
    implementation libs.shedlock.provider.jdbc.template

    // 通知（IT8 T3.2 / ADR-0018、SendGrid Dynamic Templates）
    implementation libs.sendgrid.java

    // cross-service ACL（IT8 T4.1 / ADR-0015 後半、RestShipperInfoAcl + Resilience4j + Caffeine）
    // HTTP クライアントは Spring 6.1 RestClient を利用（既存 spring-boot-starter-web 由来）
    implementation libs.resilience4j.spring.boot3
    implementation libs.caffeine
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    // Resilience4j @CircuitBreaker / @Cacheable は AOP プロキシ経由で動作するため必須
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Payment Gateway（IT9 A1 / ADR-0020、Stripe webhook + HMAC 署名検証）
    implementation libs.stripe.java
    // Gson は Stripe SDK の内部 deserialize で使用されるが、明示的に依存追加して
    // StripeEventTranslator の raw JSON 解析にも利用する
    implementation 'com.google.code.gson:gson:2.11.0'

    // 開発時のみ
    developmentOnly libs.spring.boot.devtools

    // テスト
    testImplementation libs.axon.test
    testImplementation libs.mybatis.spring.boot.starter.test
    testImplementation libs.testcontainers.junit.jupiter
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.kafka
    // SendGrid WireMock 統合テスト（IT8 T3.3）
    testImplementation libs.wiremock
}

test {
    useJUnitPlatform()
    // Docker Desktop 29.x（MinAPI 1.40）では Testcontainers の docker-java が既定で
    // 古い API バージョンを使い HTTP 400 になるため、サポート範囲内の API バージョンを明示する。
    systemProperty 'api.version', '1.43'
    environment 'DOCKER_API_VERSION', '1.43'
}

bootJar {
    archiveBaseName = 'billingms'
}
