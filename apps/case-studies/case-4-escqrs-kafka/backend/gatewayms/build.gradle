/*
 * gatewayms（API Gateway）
 *
 * Spring Cloud Gateway による JWT 検証とパスベースルーティングを担う。
 * リアクティブスタック（WebFlux）で動作する。
 */

plugins {
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${libs.versions.springCloud.get()}"
    }
}

dependencies {
    implementation project(':shared')

    // Spring Cloud Gateway（リアクティブ Gateway）
    implementation libs.spring.cloud.starter.gateway
    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.boot.starter.security

    // JWT 検証（IT9 A3.3、authms 発行 token を検証して X-Forwarded-User/Role を upstream に付与）
    implementation libs.jjwt.api
    runtimeOnly libs.jjwt.impl
    runtimeOnly libs.jjwt.jackson

    // 開発時のみ
    developmentOnly libs.spring.boot.devtools

    // テスト
    testImplementation libs.spring.boot.starter.test
    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
    testImplementation 'io.projectreactor:reactor-test'
}

bootJar {
    archiveBaseName = 'gatewayms'
}
