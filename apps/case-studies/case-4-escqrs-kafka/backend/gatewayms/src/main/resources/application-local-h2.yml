# local-h2 プロファイル: ローカル開発用ルーティング（各サービスは localhost）
spring:
  cloud:
    gateway:
      routes:
        - id: authms
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**, /api/v1/users/**
        - id: bookingms
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/bookings/**, /api/v1/shippers/**, /api/v1/quotes/**
        - id: routingms
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/voyages/**, /api/v1/routes/**
        - id: trackingms
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/tracking/**
        - id: handlingms
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/handling/**
        - id: billingms
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/billing/**

logging:
  level:
    com.example.gatewayms: DEBUG
    org.springframework.cloud.gateway: INFO
