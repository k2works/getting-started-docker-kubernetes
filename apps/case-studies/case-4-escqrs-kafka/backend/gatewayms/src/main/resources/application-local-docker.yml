# local-docker プロファイル: Kafka/PostgreSQL は Docker、アプリは localhost または Docker ネットワーク内で起動
# コンテナ内では AUTHMS_URL / BOOKINGMS_URL / ROUTINGMS_URL / TRACKINGMS_URL / HANDLINGMS_URL / BILLINGMS_URL 環境変数でコンテナ名を指定する
spring:
  cloud:
    gateway:
      routes:
        - id: authms
          uri: ${AUTHMS_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**, /api/v1/users/**
        - id: bookingms
          uri: ${BOOKINGMS_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/bookings/**, /api/v1/shippers/**, /api/v1/quotes/**
        - id: routingms
          uri: ${ROUTINGMS_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/voyages/**, /api/v1/routes/**
        - id: trackingms
          uri: ${TRACKINGMS_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/tracking/**
        - id: handlingms
          uri: ${HANDLINGMS_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/handling/**
        - id: billingms
          uri: ${BILLINGMS_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/billing/**

logging:
  level:
    com.example.gatewayms: INFO
