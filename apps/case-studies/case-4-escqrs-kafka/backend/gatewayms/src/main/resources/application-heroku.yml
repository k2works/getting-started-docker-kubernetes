# heroku プロファイル: Heroku 上のサービス間ルーティング
# IT9 A3.3: authms 発行 JWT を検証して X-Forwarded-User/Role を upstream に付与する
# JWT 秘密鍵は authms と共有（Heroku Config Vars の JWT_SECRET を 32 バイト以上で設定）
jwt:
  secret: ${JWT_SECRET}

spring:
  cloud:
    gateway:
      routes:
        - id: authms
          uri: ${AUTHMS_URL}
          predicates:
            - Path=/api/auth/**, /api/v1/users/**
        - id: bookingms
          uri: ${BOOKINGMS_URL}
          predicates:
            - Path=/api/v1/bookings/**, /api/v1/shippers/**, /api/v1/quotes/**
        - id: routingms
          uri: ${ROUTINGMS_URL}
          predicates:
            - Path=/api/v1/voyages/**, /api/v1/routes/**
        - id: trackingms
          uri: ${TRACKINGMS_URL}
          predicates:
            - Path=/api/v1/tracking/**
        - id: handlingms
          uri: ${HANDLINGMS_URL}
          predicates:
            - Path=/api/v1/handling/**
        - id: billingms
          uri: ${BILLINGMS_URL}
          predicates:
            - Path=/api/v1/billing/**

server:
  port: ${PORT:8080}

logging:
  level:
    com.example.gatewayms: INFO
    root: WARN
