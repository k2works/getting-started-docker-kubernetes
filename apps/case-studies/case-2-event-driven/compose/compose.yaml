# 国際貨物輸送システム（イベント駆動マイクロサービス版）の Docker Compose 構成。
#
# パスワードは environment に直書きせず、ファイルベースの secrets で注入する
# （第 4 章のタスクアプリと同じ方式）。初回のみ:
#   cp secrets/db_password.example secrets/db_password
# サービスイメージは事前にビルドしておくこと（README 参照）。
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cargo_tracker
      POSTGRES_DB: cargo_tracker
      # パスワードはファイルで渡す（実体は secrets で注入）
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../ops/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargo_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    # guest/guest は RabbitMQ の既定アカウント（ローカル検証用）
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  authms:
    image: cargo2-authms:0.0.1
    build:
      context: ../backend
      dockerfile: authms/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: local-prod
      PORT: "8081"
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: cargo_tracker

    # DB_PASSWORD は secrets のファイルから読み込んで起動する（第 4 章スタイル）
    command:
      - "sh"
      - "-c"
      - 'export DB_PASSWORD="$$(cat /run/secrets/db_password)" && exec java $${JAVA_OPTS} -jar /app/app.jar'
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  bookingms:
    image: cargo2-bookingms:0.0.1
    build:
      context: ../backend
      dockerfile: bookingms/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local-prod
      PORT: "8082"
      DB_URL: jdbc:postgresql://postgres:5432/booking_db
      DB_USERNAME: cargo_tracker
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    # DB_PASSWORD は secrets のファイルから読み込んで起動する（第 4 章スタイル）
    command:
      - "sh"
      - "-c"
      - 'export DB_PASSWORD="$$(cat /run/secrets/db_password)" && exec java $${JAVA_OPTS} -jar /app/app.jar'
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  routingms:
    image: cargo2-routingms:0.0.1
    build:
      context: ../backend
      dockerfile: routingms/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: local-prod
      PORT: "8083"
      DB_URL: jdbc:postgresql://postgres:5432/routing_db
      DB_USERNAME: cargo_tracker

    # DB_PASSWORD は secrets のファイルから読み込んで起動する（第 4 章スタイル）
    command:
      - "sh"
      - "-c"
      - 'export DB_PASSWORD="$$(cat /run/secrets/db_password)" && exec java $${JAVA_OPTS} -jar /app/app.jar'
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  trackingms:
    image: cargo2-trackingms:0.0.1
    build:
      context: ../backend
      dockerfile: trackingms/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local-prod
      PORT: "8084"
      DB_URL: jdbc:postgresql://postgres:5432/tracking_db
      DB_USERNAME: cargo_tracker
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    # DB_PASSWORD は secrets のファイルから読み込んで起動する（第 4 章スタイル）
    command:
      - "sh"
      - "-c"
      - 'export DB_PASSWORD="$$(cat /run/secrets/db_password)" && exec java $${JAVA_OPTS} -jar /app/app.jar'
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  handlingms:
    image: cargo2-handlingms:0.0.1
    build:
      context: ../backend
      dockerfile: handlingms/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: local-prod
      PORT: "8085"
      DB_URL: jdbc:postgresql://postgres:5432/handling_db
      DB_USERNAME: cargo_tracker

    # DB_PASSWORD は secrets のファイルから読み込んで起動する（第 4 章スタイル）
    command:
      - "sh"
      - "-c"
      - 'export DB_PASSWORD="$$(cat /run/secrets/db_password)" && exec java $${JAVA_OPTS} -jar /app/app.jar'
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  billingms:
    image: cargo2-billingms:0.0.1
    build:
      context: ../backend
      dockerfile: billingms/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: local-prod
      PORT: "8086"
      DB_URL: jdbc:postgresql://postgres:5432/billing_db
      DB_USERNAME: cargo_tracker

    # DB_PASSWORD は secrets のファイルから読み込んで起動する（第 4 章スタイル）
    command:
      - "sh"
      - "-c"
      - 'export DB_PASSWORD="$$(cat /run/secrets/db_password)" && exec java $${JAVA_OPTS} -jar /app/app.jar'
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  gatewayms:
    image: cargo2-gatewayms:0.0.1
    build:
      context: ../backend
      dockerfile: gatewayms/Dockerfile
    depends_on:
      - authms
      - bookingms
      - routingms
      - trackingms
      - handlingms
      - billingms
    environment:
      PORT: "8080"
      AUTHMS_URL: http://authms:8081
      BOOKINGMS_URL: http://bookingms:8082
      ROUTINGMS_URL: http://routingms:8083
      TRACKINGMS_URL: http://trackingms:8084
      HANDLINGMS_URL: http://trackingms:8084
      BILLINGMS_URL: http://billingms:8086
    ports:
      - "9080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    image: cargo2-frontend:0.0.1
    build:
      context: ../frontend
    depends_on:
      - gatewayms
    environment:
      PORT: "8080"
      API_GATEWAY_URL: http://gatewayms:8080
    ports:
      - "9090:8080"

secrets:
  db_password:
    file: ./secrets/db_password

volumes:
  postgres_data:
