# Kibana 初期セットアップ Job
# デプロイ後に Kibana の起動を待ち、index pattern「logstash-*」を自動作成して
# 既定ビューを Discover に設定する。これにより手動設定なしでログ検索を開始できる。
# overwrite=true で冪等。delete → apply でも毎回正しくセットアップされる。
apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-setup
  labels:
    app.kubernetes.io/name: kibana-setup
    app.kubernetes.io/component: logging
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana-setup
        app.kubernetes.io/component: logging
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: curlimages/curl:8.10.1
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              KB="http://kibana:5601"
              echo "[setup] Kibana の起動を待機..."
              until [ "$(curl -s -o /dev/null -w '%{http_code}' "$KB/api/status")" = "200" ]; do
                sleep 5
              done
              echo "[setup] index pattern logstash-* を作成..."
              curl -sf -X POST "$KB/api/saved_objects/index-pattern/logstash?overwrite=true" \
                -H 'kbn-xsrf: true' -H 'Content-Type: application/json' \
                -d '{"attributes":{"title":"logstash-*","timeFieldName":"@timestamp"}}' >/dev/null
              echo "[setup] 既定 index pattern と起動画面（Discover）を設定..."
              curl -sf -X POST "$KB/api/kibana/settings" \
                -H 'kbn-xsrf: true' -H 'Content-Type: application/json' \
                -d '{"changes":{"defaultIndex":"logstash","defaultRoute":"/app/discover"}}' >/dev/null
              echo "[setup] Kibana セットアップ完了"
