# Kibana（ログの検索・可視化）
# EFK スタックの K。Elasticsearch に蓄積されたログを Web UI で検索・可視化する。
# NodePort 30052 でクラスタ外から http://<node-ip>:30052/ にアクセスできる。
apiVersion: v1
kind: Service
metadata:
  name: kibana
  labels:
    app.kubernetes.io/name: kibana
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kibana
  ports:
    - name: http
      protocol: TCP
      port: 5601
      targetPort: http
      nodePort: 30052
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  labels:
    app.kubernetes.io/name: kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kibana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:7.17.22
          env:
            - name: ELASTICSEARCH_HOSTS
              value: "http://elasticsearch:9200"
          ports:
            - name: http
              containerPort: 5601
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
