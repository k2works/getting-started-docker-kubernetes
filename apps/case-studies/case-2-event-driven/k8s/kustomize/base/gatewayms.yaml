apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatewayms
  labels:
    app.kubernetes.io/name: gatewayms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gatewayms
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gatewayms
    spec:
      containers:
        - name: gatewayms
          image: cargo2-gatewayms:0.0.1
          env:
            - name: PORT
              value: "8080"
            - name: AUTHMS_URL
              value: http://authms:8081
            - name: BOOKINGMS_URL
              value: http://bookingms:8082
            - name: ROUTINGMS_URL
              value: http://routingms:8083
            - name: TRACKINGMS_URL
              value: http://trackingms:8084
            - name: HANDLINGMS_URL
              value: http://trackingms:8084
            - name: BILLINGMS_URL
              value: http://billingms:8086
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 18
---
apiVersion: v1
kind: Service
metadata:
  name: gatewayms
  labels:
    app.kubernetes.io/name: gatewayms
spec:
  selector:
    app.kubernetes.io/name: gatewayms
  ports:
    - name: http
      port: 8080
      targetPort: http
