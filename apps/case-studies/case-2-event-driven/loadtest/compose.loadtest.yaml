# ケーススタディ2（イベント駆動マイクロサービス版）の Locust 負荷テスト用 Compose 構成。
#
# アプリ本体は dev:case2 で起動し、gateway をホスト 9080 に公開する。
# Locust は別 Compose として独立させ、host.docker.internal 経由で gateway に負荷をかける。
#
# 使い方:
#   1. アプリ本体を起動:   npx gulp dev:case2
#   2. Locust を起動:       npx gulp loadtest:case2   → http://localhost:8089
name: loadtest-case2

services:
  locust:
    image: locustio/locust:2.32.5
    ports:
      - "8089:8089"
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py:ro
    environment:
      LOCUST_LOCUSTFILE: /mnt/locust/locustfile.py
      # 負荷対象。ホストに公開された 9080 番（gatewayms: 9080:8080）へ向ける。
      LOCUST_HOST: ${TARGET_URL:-http://host.docker.internal:9080}
      # ログインユーザー（既定はシード済みの admin / password）。
      LOGIN_USERNAME: ${LOGIN_USERNAME:-admin}
      LOGIN_PASSWORD: ${LOGIN_PASSWORD:-password}
    extra_hosts:
      - "host.docker.internal:host-gateway"
