apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cargo-event
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: {{ .Values.frontend.name }}
                port:
                  number: 80
