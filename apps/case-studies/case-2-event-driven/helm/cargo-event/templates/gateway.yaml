apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.gateway.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.gateway.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.gateway.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.gateway.name }}
    spec:
      containers:
        - name: {{ .Values.gateway.name }}
          image: cargo2-{{ .Values.gateway.name }}:{{ .Values.imageTag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.gateway.port | quote }}
            - name: AUTHMS_URL
              value: http://authms:8081
            - name: BOOKINGMS_URL
              value: http://bookingms:8082
            - name: ROUTINGMS_URL
              value: http://routingms:8083
            - name: TRACKINGMS_URL
              value: http://trackingms:8084
            - name: HANDLINGMS_URL
              value: http://trackingms:8084
            - name: BILLINGMS_URL
              value: http://billingms:8086
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 18
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.gateway.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.gateway.name }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.gateway.name }}
  ports:
    - name: http
      port: {{ .Values.gateway.port }}
      targetPort: http
