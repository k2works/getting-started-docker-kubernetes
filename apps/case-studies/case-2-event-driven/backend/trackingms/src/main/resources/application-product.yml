# Heroku 等のクラウド本番想定プロファイル
# DB は H2 メモリ DB（Heroku の dyno 再起動でデータが消える前提）。
# DB_URL などの環境変数で将来 PostgreSQL 等に切り替えられるようにする。
# RabbitMQ は CloudAMQP の個別環境変数（RABBITMQ_HOST/PORT/USERNAME/PASSWORD/VIRTUAL_HOST）を読む。
#
# NOTE: spring.main.lazy-initialization は有効化しない。
#   @RabbitListener のメッセージリスナーコンテナまで遅延初期化対象となり、起動時にキューを
#   subscribe しないため AMQP メッセージを受信できなくなる。
spring:
  jmx:
    enabled: false
  datasource:
    url: ${DB_URL:jdbc:h2:mem:tracking_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # CloudAMQP は vhost に独自値（通常はユーザー名と同じ）を使うため必須。
    # デフォルトは '/'（RabbitMQ の標準 vhost）。
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    # CloudAMQP の amqps:// 接続（ポート 5671）は TLS を有効化する必要がある。
    # 平文 AMQP (amqp://, ポート 5672) の場合は false。
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
    listener:
      simple:
        missing-queues-fatal: false
