# ローカル本番検証プロファイル
# クラウド本番に近い構成（PostgreSQL + RabbitMQ）をローカル Docker でそのまま動かすための設定。
# cargo-tracker-postgres はホスト側 5442 に公開している（他プロジェクトの sms-postgres と衝突回避のため）。
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5442/tracking_db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:cargo_tracker}
    password: ${DB_PASSWORD:cargo_tracker}
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        missing-queues-fatal: false
