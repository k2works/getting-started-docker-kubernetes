server:
  port: ${PORT:8086}

spring:
  application:
    name: trackingms
  datasource:
    url: jdbc:h2:mem:tracking_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
        missing-queues-fatal: false

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
