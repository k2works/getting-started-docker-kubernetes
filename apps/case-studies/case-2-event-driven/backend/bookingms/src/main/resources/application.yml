server:
  port: ${PORT:8082}

spring:
  application:
    name: bookingms
  datasource:
    url: jdbc:h2:mem:booking_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  rabbitmq:
    listener:
      simple:
        missing-queues-fatal: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
