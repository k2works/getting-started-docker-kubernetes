apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.gateway.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.gateway.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.gateway.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.gateway.name }}
    spec:
      containers:
        - name: {{ .Values.gateway.name }}
          image: cargo3-{{ .Values.gateway.name }}:{{ .Values.imageTag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.gateway.port | quote }}
            {{- range $k, $v := .Values.gateway.routes }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            # gateway は JWT を検証するため、authms の署名鍵と同じ JWT_SECRET が必須
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: app-secrets, key: JWT_SECRET } }
            - name: JWT_ISSUER
              value: case-study-cargo-tracker
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 24
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.gateway.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.gateway.name }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.gateway.name }}
  ports:
    - name: http
      port: {{ .Values.gateway.port }}
      targetPort: http
