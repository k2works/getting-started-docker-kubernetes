apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secret.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secret.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.secret.postgresDb | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.secret.postgresUser | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.secret.postgresPassword | quote }}
  JWT_SECRET: {{ .Values.secret.jwtSecret | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  init-databases.sh: |
{{ .Files.Get "init-databases.sh" | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_DB } }
            - name: POSTGRES_MULTIPLE_DATABASES
              value: {{ .Values.postgres.multipleDatabases | quote }}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U {{ .Values.secret.postgresUser }} -d {{ .Values.secret.postgresDb }}"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: axonserver
  labels:
    app.kubernetes.io/name: axonserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: axonserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: axonserver
    spec:
      containers:
        - name: axonserver
          image: {{ .Values.axonserver.image }}
          env:
            - name: AXONIQ_AXONSERVER_NAME
              value: axonserver
            - name: AXONIQ_AXONSERVER_HOSTNAME
              value: axonserver
            - name: AXONIQ_AXONSERVER_DEVMODE_ENABLED
              value: "true"
            - name: AXONIQ_AXONSERVER_STANDALONE
              value: "true"
            - name: AXONIQ_AXONSERVER_STANDALONE_DCB
              value: "true"
          ports:
            - name: http
              containerPort: 8024
            - name: grpc
              containerPort: 8124
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: axonserver
spec:
  selector:
    app.kubernetes.io/name: axonserver
  ports:
    - name: http
      port: 8024
      targetPort: http
    - name: grpc
      port: 8124
      targetPort: grpc
