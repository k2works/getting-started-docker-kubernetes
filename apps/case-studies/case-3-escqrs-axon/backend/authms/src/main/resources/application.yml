# authms ベース設定
#
# プロファイル戦略（docs/operation/アプリケーション開発環境セットアップ手順書.md 準拠）:
#   - local-h2     : H2 インメモリ（IDE 起動・最速 TDD）
#   - local-docker : PostgreSQL（docker compose 起動）
#   - staging/prod : 環境変数からシークレットを読み込む

spring:
  application:
    name: authms
  profiles:
    default: local-h2

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.example.cargotracker: DEBUG

# JWT 設定
app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-change-in-production-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false
  packages-to-scan: com.example.cargotracker.authms
