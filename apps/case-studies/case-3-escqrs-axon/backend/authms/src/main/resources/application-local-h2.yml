# ローカル開発：H2 インメモリ
#
# 用途: IDE 起動・最速 TDD ループ。

spring:
  datasource:
    url: jdbc:h2:mem:authms;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
  # Spring Boot DevTools。詳細は bookingms 側の application-local-h2.yml を参照。
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s
    livereload:
      enabled: true
