# Heroku デプロイ用プロファイル
#
# 用途: Heroku 開発環境デプロイ（IT1 スコープ）
# - H2 インメモリ DB（PostgreSQL アドオン不要）
# - Axon Server 不使用（gRPC ポート制約回避）
# - PORT 環境変数でポートを動的設定

server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:h2:mem:authms;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: false
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: WARN
    com.example.cargotracker: INFO
