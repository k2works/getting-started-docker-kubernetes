# ローカル開発：H2 インメモリ + Axon Server（E2E テスト用）
#
# 用途: E2E テスト・サービス間イベント伝播の確認。
# H2 データベース（PostgreSQL 不要）と Axon Server（Docker で起動）を組み合わせる。
# Axon Server のみ `docker compose up axonserver` で起動しておくこと。
#
# Event Processor は pooled-streaming（デフォルト）で Axon Server 経由のイベント配信を使用する。
# サービス間の CargoTrackedEvent 等がこのプロファイルで伝播される。

spring:
  datasource:
    url: jdbc:h2:mem:bookingms;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s
    livereload:
      enabled: true

axon:
  axonserver:
    servers: ${AXON_AXONSERVER_SERVERS:localhost:8124}
