# ローカル開発：PostgreSQL + Axon Server（docker compose）
#
# 用途: docker compose up でフル起動した状態での結合確認。
# シークレットは docker-compose.yml が .env から注入する。
#
# local-h2 と異なり Axon Server に接続できるため、PooledStreamingEventProcessor が
# 利用可能（Event Store からトークン経由で読む）。Read Model 投影は本来モードである
# pooled-streaming に戻る（local-h2 の subscribing 上書きは local-h2 プロファイル限定）。

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/routing_read_db}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

axon:
  axonserver:
    servers: ${AXON_AXONSERVER_SERVERS:localhost:8124}
  # IT3（ADR-0009）: pooled-streaming に復帰。axon-server-connector を依存に追加し、
  # token_entry テーブルを Flyway（V002）で用意したため、Event Processor のデフォルト
  # モード（pooled-streaming）で Axon Server 経由のイベント配信が成立する。
  # 旧 IT2 暫定の subscribing 上書きは削除済み。
