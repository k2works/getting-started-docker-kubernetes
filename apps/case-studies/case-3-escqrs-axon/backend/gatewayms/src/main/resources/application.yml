# gatewayms ベース設定
#
# IT2 スコープ: authms / bookingms / routingms ルーティング（US24 で routingms 追加）

spring:
  application:
    name: gatewayms
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: authms
              uri: ${AUTHMS_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
            - id: bookingms
              uri: ${BOOKINGMS_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/bookings/**,/api/v1/shippers/**,/api/v1/quotations/**,/api/ping
            - id: routingms
              uri: ${ROUTINGMS_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/voyages/**,/api/v1/routing/**
            - id: handlingms
              uri: ${HANDLINGMS_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/handling/**
            - id: trackingms
              uri: ${TRACKINGMS_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/tracking/**
            - id: billingms
              uri: ${BILLINGMS_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/billing/**

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-change-in-production-min-32-chars}

logging:
  level:
    root: WARN
    com.example.cargotracker: INFO
    org.springframework.cloud.gateway: INFO
