# handlingms ベース設定
#
# プロファイル戦略（routingms と同じ規約）:
#   - local-h2     : H2 インメモリ（IDE 起動・最速 TDD）
#   - local-docker : PostgreSQL + Axon Server（docker compose 起動）
#   - test         : テスト時。Testcontainers で PostgreSQL 起動
#   - staging/prod : 環境変数からシークレットを読み込む
#
# 関連 ADR: ADR-0012 handlingms と trackingms の責務分離

mybatis:
  mapper-locations: classpath:mybatis/mapper/*.xml

spring:
  application:
    name: handlingms
  profiles:
    default: local-h2
  main:
    # Axon 5.1 ↔ Flyway 11 ↔ Spring Boot 4 の Bean 循環参照を回避（routingms と同方針）
    allow-circular-references: true

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.example.cargotracker: DEBUG
    org.axonframework: INFO

axon:
  axonserver:
    servers: ${AXON_AXONSERVER_SERVERS:localhost:8124}

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false
  packages-to-scan: com.example.cargotracker.handlingms
