# ローカル開発：H2 インメモリ + Axon ダミー
#
# 用途: IDE 起動・最速 TDD ループ。
# Axon Server は接続できないため bootRun 起動時にリトライログが出るが、
# ヘルスチェック自体は H2 のみで成立する。

spring:
  datasource:
    url: jdbc:h2:mem:handlingms;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s
    livereload:
      enabled: true

axon:
  axonserver:
    enabled: false
  eventhandling:
    processors:
      "[com.example.cargotracker.handlingms.application.eventhandlers]":
        mode: subscribing
