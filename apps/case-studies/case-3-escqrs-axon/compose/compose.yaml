# 国際貨物輸送システム（ES/CQRS Axon 版）の Docker Compose 構成。
#
# 機密は .env で注入する（初回: cp .env.example .env）。
# サービスイメージは事前にビルドしておくこと（README 参照）。
services:
  axonserver:
    image: axoniq/axonserver:2026.0.0
    environment:
      AXONIQ_AXONSERVER_NAME: axonserver
      AXONIQ_AXONSERVER_HOSTNAME: axonserver
      AXONIQ_AXONSERVER_DEVMODE_ENABLED: "true"
      AXONIQ_AXONSERVER_STANDALONE: "true"
      AXONIQ_AXONSERVER_STANDALONE_DCB: "true"
    ports:
      - "8024:8024"
    volumes:
      - axonserver-data:/axonserver/data
      - axonserver-events:/axonserver/events
      - axonserver-config:/axonserver/config
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8024/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_MULTIPLE_DATABASES: >-
        auth_db,booking_read_db,routing_read_db,tracking_read_db,handling_read_db,billing_read_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../ops/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  authms:
    image: cargo3-authms:0.0.1
    build:
      context: ../backend
      dockerfile: authms/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local-docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-case-study-cargo-tracker}

  bookingms:
    image: cargo3-bookingms:0.0.1
    build:
      context: ../backend
      dockerfile: bookingms/Dockerfile
    depends_on:
      axonserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local-docker
      AXON_AXONSERVER_SERVERS: axonserver:8124
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booking_read_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

  routingms:
    image: cargo3-routingms:0.0.1
    build:
      context: ../backend
      dockerfile: routingms/Dockerfile
    depends_on:
      axonserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local-docker
      AXON_AXONSERVER_SERVERS: axonserver:8124
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/routing_read_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

  handlingms:
    image: cargo3-handlingms:0.0.1
    build:
      context: ../backend
      dockerfile: handlingms/Dockerfile
    depends_on:
      axonserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local-docker
      AXON_AXONSERVER_SERVERS: axonserver:8124
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/handling_read_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

  trackingms:
    image: cargo3-trackingms:0.0.1
    build:
      context: ../backend
      dockerfile: trackingms/Dockerfile
    depends_on:
      axonserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local-docker
      AXON_AXONSERVER_SERVERS: axonserver:8124
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tracking_read_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

  billingms:
    image: cargo3-billingms:0.0.1
    build:
      context: ../backend
      dockerfile: billingms/Dockerfile
    depends_on:
      axonserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local-docker
      AXON_AXONSERVER_SERVERS: axonserver:8124
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/billing_read_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

  gatewayms:
    image: cargo3-gatewayms:0.0.1
    build:
      context: ../backend
      dockerfile: gatewayms/Dockerfile
    depends_on:
      - authms
      - bookingms
      - routingms
      - handlingms
      - trackingms
      - billingms
    environment:
      SPRING_PROFILES_ACTIVE: local-docker
      AUTHMS_URL: http://authms:8081
      BOOKINGMS_URL: http://bookingms:8082
      ROUTINGMS_URL: http://routingms:8083
      HANDLINGMS_URL: http://handlingms:8085
      TRACKINGMS_URL: http://trackingms:8086
      BILLINGMS_URL: http://billingms:8087
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-case-study-cargo-tracker}
    ports:
      - "9081:8080"

  frontend:
    image: cargo3-frontend:0.0.1
    build:
      context: ../frontend
    depends_on:
      - gatewayms
    environment:
      PORT: "8080"
      GATEWAY_URL: http://gatewayms:8080
    ports:
      - "9091:8080"

volumes:
  axonserver-data:
  axonserver-events:
  axonserver-config:
  postgres-data:
