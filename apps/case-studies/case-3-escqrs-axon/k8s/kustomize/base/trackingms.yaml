apiVersion: apps/v1
kind: Deployment
metadata:
  name: trackingms
  labels:
    app.kubernetes.io/name: trackingms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trackingms
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trackingms
    spec:
      containers:
        - name: trackingms
          image: cargo3-trackingms:0.0.1
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: local-docker
            - name: PORT
              value: "8086"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/tracking_read_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: app-secrets, key: SPRING_DATASOURCE_USERNAME } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: SPRING_DATASOURCE_PASSWORD } }
            - name: AXON_AXONSERVER_SERVERS
              value: axonserver:8124
          ports:
            - name: http
              containerPort: 8086
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: trackingms
  labels:
    app.kubernetes.io/name: trackingms
spec:
  selector:
    app.kubernetes.io/name: trackingms
  ports:
    - name: http
      port: 8086
      targetPort: http
