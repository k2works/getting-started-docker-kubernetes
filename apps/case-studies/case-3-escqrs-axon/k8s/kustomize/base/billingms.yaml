apiVersion: apps/v1
kind: Deployment
metadata:
  name: billingms
  labels:
    app.kubernetes.io/name: billingms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: billingms
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billingms
    spec:
      containers:
        - name: billingms
          image: cargo3-billingms:0.0.1
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: local-docker
            - name: PORT
              value: "8087"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/billing_read_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: app-secrets, key: SPRING_DATASOURCE_USERNAME } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: SPRING_DATASOURCE_PASSWORD } }
            - name: AXON_AXONSERVER_SERVERS
              value: axonserver:8124
          ports:
            - name: http
              containerPort: 8087
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: billingms
  labels:
    app.kubernetes.io/name: billingms
spec:
  selector:
    app.kubernetes.io/name: billingms
  ports:
    - name: http
      port: 8087
      targetPort: http
