apiVersion: apps/v1
kind: Deployment
metadata:
  name: authms
  labels:
    app.kubernetes.io/name: authms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authms
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authms
    spec:
      containers:
        - name: authms
          image: cargo3-authms:0.0.1
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: local-docker
            - name: PORT
              value: "8081"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/auth_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: app-secrets, key: SPRING_DATASOURCE_USERNAME } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: SPRING_DATASOURCE_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: app-secrets, key: JWT_SECRET } }
            - name: JWT_ISSUER
              value: case-study-cargo-tracker
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: authms
  labels:
    app.kubernetes.io/name: authms
spec:
  selector:
    app.kubernetes.io/name: authms
  ports:
    - name: http
      port: 8081
      targetPort: http
