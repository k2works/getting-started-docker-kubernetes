apiVersion: apps/v1
kind: Deployment
metadata:
  name: handlingms
  labels:
    app.kubernetes.io/name: handlingms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: handlingms
  template:
    metadata:
      labels:
        app.kubernetes.io/name: handlingms
    spec:
      containers:
        - name: handlingms
          image: cargo3-handlingms:0.0.1
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: local-docker
            - name: PORT
              value: "8085"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/handling_read_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: app-secrets, key: SPRING_DATASOURCE_USERNAME } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: SPRING_DATASOURCE_PASSWORD } }
            - name: AXON_AXONSERVER_SERVERS
              value: axonserver:8124
          ports:
            - name: http
              containerPort: 8085
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: handlingms
  labels:
    app.kubernetes.io/name: handlingms
spec:
  selector:
    app.kubernetes.io/name: handlingms
  ports:
    - name: http
      port: 8085
      targetPort: http
