apiVersion: apps/v1
kind: Deployment
metadata:
  name: axonserver
  labels:
    app.kubernetes.io/name: axonserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: axonserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: axonserver
    spec:
      containers:
        - name: axonserver
          image: axoniq/axonserver:2026.0.0
          env:
            - name: AXONIQ_AXONSERVER_NAME
              value: axonserver
            - name: AXONIQ_AXONSERVER_HOSTNAME
              value: axonserver
            - name: AXONIQ_AXONSERVER_DEVMODE_ENABLED
              value: "true"
            - name: AXONIQ_AXONSERVER_STANDALONE
              value: "true"
            - name: AXONIQ_AXONSERVER_STANDALONE_DCB
              value: "true"
          ports:
            - name: http
              containerPort: 8024
            - name: grpc
              containerPort: 8124
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: axonserver
spec:
  selector:
    app.kubernetes.io/name: axonserver
  ports:
    - name: http
      port: 8024
      targetPort: http
    - name: grpc
      port: 8124
      targetPort: grpc
