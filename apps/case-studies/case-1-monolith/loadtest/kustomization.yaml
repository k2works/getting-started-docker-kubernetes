# ケーススタディ1（モノリス版）Locust 負荷テストの Kustomize 定義。
#
# アプリ本体（k8s:case1）と同じ名前空間に Locust をデプロイする。
#   npx gulp loadtest:case1:k8s        … デプロイ
#   npx gulp loadtest:case1:k8s:open   … Web UI を port-forward して開く
#   npx gulp loadtest:case1:k8s:delete … 削除
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cargo-monolith

# シナリオ（compose 版と共有）を ConfigMap として配布する。
configMapGenerator:
  - name: locust-scenario
    files:
      - locustfile.py

resources:
  - k8s-locust.yaml
