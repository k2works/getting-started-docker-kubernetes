apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cargo-monolith

resources:
  - namespace.yaml
  - secret.yaml
  - postgres.yaml
  - app.yaml
  - ingress.yaml
  # ロギング基盤（EFK + DaemonSet）
