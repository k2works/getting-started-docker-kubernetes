plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.sonarqube' version '6.3.1.5724'
    id 'checkstyle'
    id 'com.github.spotbugs' version '6.1.3'
    id 'jacoco'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.webjars:bootstrap:5.3.3'
    implementation 'org.webjars.npm:htmx.org:2.0.4'
    implementation 'org.webjars:webjars-locator-lite:1.0.1'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'com.github.docker-java:docker-java-api:3.7.0'
    testImplementation 'com.github.docker-java:docker-java-transport:3.7.0'
    testImplementation 'com.github.docker-java:docker-java-transport-zerodep:3.7.0'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom 'org.testcontainers:testcontainers-bom:1.20.4'
    }
}

checkstyle {
    toolVersion = '10.21.4'
    configFile = file("${projectDir}/config/checkstyle/checkstyle.xml")
    ignoreFailures = true
}

spotbugs {
    ignoreFailures = true
    excludeFilter = file("${projectDir}/config/spotbugs/exclude-filter.xml")
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask) {
    reports {
        html.required = true
        xml.required = false
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
    }
}

sonar {
    properties {
        property 'sonar.projectKey', 'cargo-tracker'
        property 'sonar.projectName', 'Cargo Tracker'
        property 'sonar.sourceEncoding', 'UTF-8'
        property 'sonar.exclusions',
            '**/domain/model/valueobjects/*.java,' +
            '**/interfaces/rest/dto/*Response.java,' +
            '**/interfaces/rest/transform/*Assembler.java,' +
            '**/interfaces/web/*ThymeleafController.java,' +
            '**/infrastructure/repositories/*Mapper.java,' +
            '**/infrastructure/repositories/MyBatis*Repository.java,' +
            '**/infrastructure/repositories/*Record.java,' +
            'src/test/**/*.java,' +
            '**/src/test/**/*.java'
        property 'sonar.cpd.exclusions',
            '**/domain/model/valueobjects/*.java,' +
            '**/domain/model/aggregates/Shipper.java,' +
            '**/interfaces/rest/dto/*Request.java,' +
            '**/interfaces/rest/dto/*Response.java,' +
            '**/interfaces/rest/transform/*Assembler.java,' +
            '**/interfaces/web/*ThymeleafController.java,' +
            '**/resources/templates/**/*.html,' +
            '**/application/internal/commandservices/*CommandService.java,' +
            '**/infrastructure/repositories/*Mapper.java,' +
            '**/infrastructure/repositories/MyBatis*Repository.java,' +
            '**/infrastructure/repositories/*Record.java,' +
            '**/src/test/**/*.java,' +
            'src/test/**/*.java'
        property 'sonar.test.exclusions',
            'src/test/**/*.java'
        property 'sonar.coverage.jacoco.xmlReportPaths',
            layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile.absolutePath
    }
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    maxParallelForks = 1
    reports {
        junitXml.required = false
        html.required = true
    }
    environment 'DOCKER_API_VERSION', '1.43'
    systemProperty 'DOCKER_API_VERSION', '1.43'
    systemProperty 'api.version', '1.43'
    // Java 25 で Byte Buddy が ClassFileVersion を解決できない問題への対応
    jvmArgs '-Dnet.bytebuddy.experimental=true'
}

tasks.named('sonar') {
    dependsOn test
}
