<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約登録 - Cargo Tracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar('bookings')}"></div>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4">予約登録</h1>

                    <form th:action="${estimateId != null ? '/bookings?estimateId=' + estimateId : '/bookings'}" th:object="${booking}" method="post">
                        <div th:if="${estimateId != null}" class="alert alert-info" role="alert">
                            見積の内容が入力されています。荷主を選択して登録してください。
                        </div>
                        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                            入力内容を確認してください。
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="shipperId" class="form-label">荷主</label>
                                <select id="shipperId" th:field="*{shipperId}" class="form-select"
                                        required aria-describedby="shipperIdHelp">
                                    <option value="">選択してください</option>
                                    <option th:each="s : ${shippers}"
                                            th:value="${s.id}"
                                            th:text="${s.name + ' (' + s.code + ')'}">荷主名</option>
                                </select>
                                <div id="shipperIdHelp" class="invalid-feedback d-block" th:errors="*{shipperId}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="cargoType" class="form-label">貨物種別</label>
                                <select id="cargoType" th:field="*{cargoType}" class="form-select"
                                        required aria-describedby="cargoTypeHelp"
                                        onchange="toggleSpecialFields()">
                                    <option value="">選択してください</option>
                                    <option th:each="ct : ${cargoTypes}"
                                            th:value="${ct.name()}"
                                            th:text="${ct.displayName}">一般</option>
                                </select>
                                <div id="cargoTypeHelp" class="invalid-feedback d-block" th:errors="*{cargoType}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="weight" class="form-label">重量 <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input id="weight" type="number" step="0.001" min="0.001" th:field="*{weight}" class="form-control"
                                           required aria-describedby="weightHelp">
                                    <span class="input-group-text">kg</span>
                                </div>
                                <div id="weightHelp" class="invalid-feedback d-block" th:errors="*{weight}"></div>
                            </div>

                            <div class="col-md-4">
                                <label for="dimensionLength" class="form-label">寸法 - 長さ (m)</label>
                                <input id="dimensionLength" type="number" step="0.001" min="0.001" th:field="*{dimensionLength}" class="form-control">
                            </div>

                            <div class="col-md-4">
                                <label for="dimensionWidth" class="form-label">寸法 - 幅 (m)</label>
                                <input id="dimensionWidth" type="number" step="0.001" min="0.001" th:field="*{dimensionWidth}" class="form-control">
                            </div>

                            <div class="col-md-4">
                                <label for="dimensionHeight" class="form-label">寸法 - 高さ (m)</label>
                                <input id="dimensionHeight" type="number" step="0.001" min="0.001" th:field="*{dimensionHeight}" class="form-control">
                            </div>

                            <div class="col-md-6">
                                <label for="quantity" class="form-label">個数</label>
                                <input id="quantity" type="number" min="1" th:field="*{quantity}" class="form-control">
                            </div>

                            <div class="col-md-6">
                                <label for="description" class="form-label">品名</label>
                                <input id="description" type="text" th:field="*{description}" class="form-control"
                                       maxlength="500" placeholder="例: 電子部品一式">
                            </div>

                            <div class="col-md-6">
                                <label for="arrivalDeadline" class="form-label">希望着日</label>
                                <input id="arrivalDeadline" type="date" th:field="*{arrivalDeadline}" class="form-control"
                                       required aria-describedby="arrivalDeadlineHelp">
                                <div id="arrivalDeadlineHelp" class="invalid-feedback d-block" th:errors="*{arrivalDeadline}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="originUnlocode" class="form-label">出発地（UN/LOCODE）</label>
                                <input id="originUnlocode" type="text" th:field="*{originUnlocode}" class="form-control text-uppercase"
                                       required aria-describedby="originUnlocodeHelp" placeholder="JPTYO"
                                       maxlength="5" pattern="[A-Za-z]{5}">
                                <div id="originUnlocodeHelp" class="form-text">例: JPTYO（東京）、JPOSA（大阪）、USLAX（ロサンゼルス）</div>
                                <div class="invalid-feedback d-block" th:errors="*{originUnlocode}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="destinationUnlocode" class="form-label">目的地（UN/LOCODE）</label>
                                <input id="destinationUnlocode" type="text" th:field="*{destinationUnlocode}" class="form-control text-uppercase"
                                       required aria-describedby="destinationUnlocodeHelp" placeholder="NLRTM"
                                       maxlength="5" pattern="[A-Za-z]{5}">
                                <div id="destinationUnlocodeHelp" class="form-text">例: NLRTM（ロッテルダム）、CNSHA（上海）、SGSIN（シンガポール）</div>
                                <div class="invalid-feedback d-block" th:errors="*{destinationUnlocode}"></div>
                            </div>

                            <!-- 危険物セクション -->
                            <div id="hazardous-section" class="d-none col-12 border rounded p-3 bg-warning-subtle">
                                <h6>危険物申告情報</h6>
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label for="hazardousClass" class="form-label">危険物クラス <span class="text-danger">*</span></label>
                                        <input id="hazardousClass" type="text" th:field="*{hazardousClass}" class="form-control"
                                               placeholder="例: 3">
                                        <div class="invalid-feedback d-block" th:errors="*{hazardousClass}"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="unNumber" class="form-label">UN番号 <span class="text-danger">*</span></label>
                                        <input id="unNumber" type="text" th:field="*{unNumber}" class="form-control"
                                               placeholder="例: UN1203">
                                        <div class="invalid-feedback d-block" th:errors="*{unNumber}"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="properShippingName" class="form-label">正式品名 <span class="text-danger">*</span></label>
                                        <input id="properShippingName" type="text" th:field="*{properShippingName}" class="form-control"
                                               placeholder="例: ガソリン">
                                        <div class="invalid-feedback d-block" th:errors="*{properShippingName}"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- 冷凍・冷蔵セクション -->
                            <div id="refrigerated-section" class="d-none col-12 border rounded p-3 bg-info-subtle">
                                <h6>温度管理条件</h6>
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label for="minTemperature" class="form-label">最低温度 <span class="text-danger">*</span></label>
                                        <input id="minTemperature" type="number" step="0.1" th:field="*{minTemperature}" class="form-control"
                                               placeholder="例: -25">
                                        <div class="invalid-feedback d-block" th:errors="*{minTemperature}"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="maxTemperature" class="form-label">最高温度 <span class="text-danger">*</span></label>
                                        <input id="maxTemperature" type="number" step="0.1" th:field="*{maxTemperature}" class="form-control"
                                               placeholder="例: -18">
                                        <div class="invalid-feedback d-block" th:errors="*{maxTemperature}"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="temperatureUnit" class="form-label">温度単位 <span class="text-danger">*</span></label>
                                        <select id="temperatureUnit" th:field="*{temperatureUnit}" class="form-select">
                                            <option value="">選択してください</option>
                                            <option value="CELSIUS">&#8451; (摂氏)</option>
                                            <option value="FAHRENHEIT">&#8457; (華氏)</option>
                                        </select>
                                        <div class="invalid-feedback d-block" th:errors="*{temperatureUnit}"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">登録する</button>
                            <a class="btn btn-outline-secondary" th:href="@{/bookings}">一覧へ戻る</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script>
  function toggleSpecialFields() {
    var cargoType = document.getElementById('cargoType').value;
    var hazardous = document.getElementById('hazardous-section');
    var refrigerated = document.getElementById('refrigerated-section');
    if (hazardous) hazardous.classList.toggle('d-none', cargoType !== 'HAZARDOUS');
    if (refrigerated) refrigerated.classList.toggle('d-none', cargoType !== 'REFRIGERATED');
  }
  document.addEventListener('DOMContentLoaded', toggleSpecialFields);
</script>
</body>
</html>
