<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約一覧 - Cargo Tracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar('bookings')}"></div>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">予約管理</h1>
            <p class="text-secondary mb-0">登録済みの貨物予約を管理します。</p>
        </div>
        <a class="btn btn-primary" th:href="@{/bookings/new}">予約を登録</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>予約番号</th>
                        <th>荷主</th>
                        <th>出発地</th>
                        <th>目的地</th>
                        <th>希望着日</th>
                        <th>状態</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(bookings)}">
                        <td colspan="7" class="text-center text-secondary py-4">登録済みの予約はありません。</td>
                    </tr>
                    <tr th:each="booking : ${bookings}">
                        <td>
                            <span th:title="${booking.bookingId}"
                                  th:text="${#strings.substring(booking.bookingId, 0, 8) + '...'}">booking-id</span>
                        </td>
                        <td th:text="${booking.shipperName != null} ? ${booking.shipperName} : ${booking.shipperId}">shipper-name</td>
                        <td th:text="${booking.originUnlocode}">JPTYO</td>
                        <td th:text="${booking.destinationUnlocode}">USLAX</td>
                        <td th:text="${booking.arrivalDeadline}">2026-04-30</td>
                        <td>
                            <span class="badge"
                                  th:classappend="'text-bg-' + ${booking.statusBadgeColor}"
                                  th:text="${booking.statusDisplayName}">仮受付</span>
                        </td>
                        <td>
                            <a class="btn btn-outline-primary btn-sm"
                               th:href="@{/bookings/{bookingId}(bookingId=${booking.bookingId})}">詳細</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
