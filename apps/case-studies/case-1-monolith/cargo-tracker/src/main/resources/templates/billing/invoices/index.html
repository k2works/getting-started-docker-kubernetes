<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>請求管理 - Cargo Tracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar('billing')}"></div>

<main class="container py-4">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">請求管理</h1>
        <a class="btn btn-primary" th:href="@{/billing/freight-calculation}">料金算出</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div th:if="${invoices.isEmpty()}" class="p-4 text-center text-secondary">
                請求書がありません。
            </div>
            <table th:if="${!invoices.isEmpty()}" class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col">請求番号</th>
                    <th scope="col">予約番号</th>
                    <th scope="col">請求金額（税抜）</th>
                    <th scope="col">割引後金額</th>
                    <th scope="col">支払期限</th>
                    <th scope="col">支払状態</th>
                    <th scope="col"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="invoice : ${invoices}">
                    <td th:text="${invoice.invoiceId.value}">INV-20260401-ABCD1234</td>
                    <td th:text="${invoice.bookingId}">BK-001</td>
                    <td th:text="${#numbers.formatInteger(invoice.totalAmountValue, 1, 'COMMA') + ' 円'}">500,000 円</td>
                    <td th:text="${#numbers.formatInteger(invoice.discountedAmountValue, 1, 'COMMA') + ' 円'}">425,000 円</td>
                    <td th:text="${invoice.dueDate}">2026-05-01</td>
                    <td>
                        <span class="badge"
                              th:classappend="${invoice.paymentStatus.name() == 'CONFIRMED'} ? 'bg-success' : (${invoice.paymentStatus.name() == 'OVERDUE'} ? 'bg-danger' : 'bg-warning text-dark')"
                              th:text="${invoice.paymentStatus.displayName}">未精算</span>
                    </td>
                    <td>
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/billing/invoices/{id}(id=${invoice.invoiceId.value})}">詳細</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
