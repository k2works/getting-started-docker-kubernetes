<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>輸送料金算出 - Cargo Tracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar('billing')}"></div>

<main class="container py-4">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">輸送料金算出</h1>
        <a class="btn btn-outline-secondary" th:href="@{/billing/invoices}">請求一覧へ戻る</a>
    </div>

    <!-- 予約ID検索フォーム -->
    <div class="card shadow-sm mb-4">
        <div class="card-header">
            <h2 class="h6 mb-0">対象予約の選択</h2>
        </div>
        <div class="card-body">
            <form method="get" th:action="@{/billing/freight-calculation}">
                <div class="row g-3 align-items-end">
                    <div class="col-md-6">
                        <label class="form-label" for="bookingId">予約 ID</label>
                        <input type="text" class="form-control" id="bookingId" name="bookingId"
                               th:value="${bookingId}" placeholder="例: BK-001" required>
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-secondary w-100">算出する</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- 料金算出結果（予約IDが指定された場合のみ表示） -->
    <div th:if="${invoice != null}" class="card shadow-sm">
        <div class="card-header">
            <h2 class="h6 mb-0">料金算出結果</h2>
        </div>
        <div class="card-body">
            <!-- 請求情報の表示 -->
            <h6 class="mb-3">輸送実績</h6>
            <dl class="row mb-4">
                <dt class="col-sm-4">予約番号</dt>
                <dd class="col-sm-8">
                    <a th:href="@{/bookings/{id}(id=${invoice.bookingId})}" th:text="${invoice.bookingId}"></a>
                </dd>

                <dt class="col-sm-4">基本料金（税抜）</dt>
                <dd class="col-sm-8" th:text="${#numbers.formatInteger(invoice.totalAmountValue, 1, 'COMMA') + ' 円'}"></dd>

                <dt class="col-sm-4">支払状態</dt>
                <dd class="col-sm-8">
                    <span class="badge"
                          th:classappend="${invoice.paymentStatus.name() == 'CONFIRMED'} ? 'bg-success' : (${invoice.paymentStatus.name() == 'OVERDUE'} ? 'bg-danger' : 'bg-warning text-dark')"
                          th:text="${invoice.paymentStatus.displayName}"></span>
                </dd>
            </dl>

            <!-- 料金確定フォーム（PENDING 状態の場合のみ） -->
            <div th:if="${invoice.paymentStatus.name() == 'PENDING'}">
                <hr>
                <h6 class="mb-3">料金確定</h6>
                <form method="post" th:action="@{/billing/freight-calculation}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="bookingId" th:value="${invoice.bookingId}"/>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label" for="adjustmentAmount">調整額（円）</label>
                            <input type="number" class="form-control" id="adjustmentAmount"
                                   name="adjustmentAmount" value="0">
                            <div class="form-text">減額の場合は負の値を入力してください（例: -10000）</div>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label" for="adjustmentReason">調整理由</label>
                            <input type="text" class="form-control" id="adjustmentReason"
                                   name="adjustmentReason" placeholder="例: 遅延補償、破損補償">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">料金を確定する</button>
                </form>
            </div>

            <div th:if="${invoice.paymentStatus.name() != 'PENDING'}" class="alert alert-info mt-3 mb-0">
                この請求書は既に確定済みです。
            </div>
        </div>
    </div>

    <div th:if="${bookingId != null and invoice == null}" class="alert alert-warning">
        予約 ID に対する請求書が見つかりませんでした。
    </div>
</main>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
