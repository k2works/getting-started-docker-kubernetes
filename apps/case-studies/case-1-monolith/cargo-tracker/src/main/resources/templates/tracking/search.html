<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>追跡情報照会 - Cargo Tracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar('tracking')}"></div>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">追跡情報照会</h1>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/tracking}" method="get">
                <div class="mb-3">
                    <label for="trackingNumber" class="form-label fw-bold">追跡番号</label>
                    <input type="text" class="form-control" id="trackingNumber" name="trackingNumber"
                           placeholder="TRK-YYYYMMDD-XXXXXXXX" required>
                </div>
                <button type="submit" class="btn btn-primary">照会する</button>
            </form>
        </div>
    </div>

    <div class="mt-3">
        <p class="text-muted small">
            ログインなしで照会する場合は
            <a th:href="@{/public/tracking}">公開追跡ページ</a>
            をご利用ください。
        </p>
    </div>
</main>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
