<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入金確認 - Cargo Tracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar('billing')}"></div>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">入金確認</h1>
            <p class="text-secondary mb-0">請求番号: <span th:text="${invoice.invoiceId.value}"></span></p>
        </div>
        <a class="btn btn-outline-secondary"
           th:href="@{/billing/invoices/{id}(id=${invoice.invoiceId.value})}">詳細へ戻る</a>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header">
            <h2 class="h6 mb-0">入金確認内容</h2>
        </div>
        <div class="card-body">
            <dl class="row mb-3">
                <dt class="col-sm-3">請求番号</dt>
                <dd class="col-sm-9" th:text="${invoice.invoiceId.value}"></dd>

                <dt class="col-sm-3">予約番号</dt>
                <dd class="col-sm-9" th:text="${invoice.bookingId}"></dd>

                <dt class="col-sm-3">割引後金額</dt>
                <dd class="col-sm-9" th:text="${#numbers.formatInteger(invoice.discountedAmountValue, 1, 'COMMA') + ' 円'}"></dd>

                <dt class="col-sm-3">支払期限</dt>
                <dd class="col-sm-9" th:text="${invoice.dueDate}"></dd>
            </dl>
            <p class="text-secondary">上記の内容で入金を確認しますか？この操作は取り消せません。</p>
            <form th:action="@{/billing/invoices/{id}/confirm(id=${invoice.invoiceId.value})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-primary">入金確認する</button>
                <a class="btn btn-outline-secondary ms-2"
                   th:href="@{/billing/invoices/{id}(id=${invoice.invoiceId.value})}">キャンセル</a>
            </form>
        </div>
    </div>
</main>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
