<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>例外処理記録 - Cargo Tracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar('tracking')}"></div>

<main class="container py-4">
    <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">例外処理記録</h1>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/tracking/exception}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="mb-3">
                    <label for="trackingNumber" class="form-label fw-bold">追跡番号</label>
                    <input type="text" class="form-control" id="trackingNumber" name="trackingNumber"
                           placeholder="TRK-YYYYMMDD-XXXXXXXX" required>
                </div>

                <div class="mb-3">
                    <label for="exceptionType" class="form-label fw-bold">例外種別</label>
                    <select class="form-select" id="exceptionType" name="exceptionType" required>
                        <option value="">選択してください</option>
                        <option th:each="type : ${exceptionTypes}"
                                th:value="${type.name()}"
                                th:text="${type.displayName}"></option>
                    </select>
                    <div class="form-text text-danger">※「紛失」を選択すると緊急フラグが設定されます</div>
                </div>

                <div class="mb-3">
                    <label for="locationUnlocode" class="form-label fw-bold">発生場所（UN/LOCODE）</label>
                    <input type="text" class="form-control" id="locationUnlocode" name="locationUnlocode"
                           placeholder="JPTYO" maxlength="10" required>
                </div>

                <div class="mb-3">
                    <label for="occurrenceTime" class="form-label fw-bold">発生日時</label>
                    <input type="datetime-local" class="form-control" id="occurrenceTime" name="occurrenceTime" required>
                </div>

                <div class="mb-3">
                    <label for="reason" class="form-label fw-bold">発生理由</label>
                    <textarea class="form-control" id="reason" name="reason" rows="3"
                              placeholder="例: 台風による輸送遅延"></textarea>
                </div>

                <div class="mb-3">
                    <label for="responseNote" class="form-label fw-bold">対応内容</label>
                    <textarea class="form-control" id="responseNote" name="responseNote" rows="3"
                              placeholder="例: 代替ルートを手配中。新しい到着予定日は〇〇です。"></textarea>
                </div>

                <button type="submit" class="btn btn-danger">例外を記録する</button>
                <a th:href="@{/tracking}" class="btn btn-outline-secondary ms-2">キャンセル</a>
            </form>
        </div>
    </div>
</main>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
